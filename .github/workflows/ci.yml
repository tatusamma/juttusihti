name: CI

on:
  push:
    branches: [master]
  pull_request:
  # The release workflow runs these checks before it builds packages.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all --check

  test:
    strategy:
      fail-fast: false
      matrix:
        # Ubuntu 22.04 (glibc 2.35) is also what the Linux release is built on.
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: runner.os == 'Linux'
        uses: ./.github/actions/linux-deps
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Pull requests reuse master's cache but do not write their own.
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # Paid live API tests and the network probe stay ignored.
      - run: cargo test --workspace --locked
      # The browser helper (Servo) is a separate workspace with its own lock file and Rust 1.88.
      - name: Browser helper clippy and tests
        working-directory: crates/browser
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then export LIBCLANG_PATH='C:/Program Files/LLVM/bin'; fi
          cargo clippy --all-targets --locked -- -D warnings
          cargo test --locked

  audit:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - run: cargo install cargo-audit --locked
      - run: cargo audit
