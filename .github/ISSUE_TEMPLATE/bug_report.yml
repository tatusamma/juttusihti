name: Bug report
description: Something does not work as it should
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Juttusihti version
      description: For example 0.7.1, from the release you downloaded.
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Windows, Linux (Debian/Ubuntu), Linux (Fedora), Linux (other)]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Add the feed https://example.com/feed.xml
        2. ...
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Remove anything private before posting.
