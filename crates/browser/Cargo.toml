# Its own workspace: Servo depends on rusqlite 0.38, which cannot share a lock file with the main
# workspace's rusqlite 0.41 (both link the native sqlite3 library). Build with
# `cargo build --manifest-path crates/browser/Cargo.toml`.
[workspace]

[package]
name = "juttusihti-browser"
description = "Headless Servo helper that loads one article in a throwaway profile and extracts its text"
version = "0.7.6"
edition = "2024"
# Servo 0.8 needs Rust 1.88; the main workspace stays at 1.85.
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/tero-k/juttusihti"

[dependencies]
# `subtlecrypto` provides `crypto.subtle`: without it Iltalehti hides the free opening paragraphs
# of its paid articles. Its RSA crate is patched below.
servo = { version = "0.8", features = ["subtlecrypto"] }
url = "2"
dpi = "0.1"
# Same version Servo uses, for `declare_surfman!` (see main.rs).
surfman = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
juttusihti-article = { path = "../article" }
# Brave's EasyList/EasyPrivacy matcher (MPL-2.0); the lists themselves are vendored in assets/.
adblock = "0.13"
# Same versions Servo uses, for the types in its resource-load API (`Destination`, `StatusCode`).
content-security-policy = "0.9"
http = "1"
base64 = "0.22"
# dup/dup2 to keep stdout for the outcome line (see src/outcome_stdout.rs).
libc = "0.2"

[dev-dependencies]
tempfile = "3"
image = { version = "0.25", default-features = false, features = ["jpeg"] }

[profile.dev.package."*"]
debug = false

# Security fixes Servo 0.8's exact pins do not allow yet; see vendor/README.md. Remove each once
# Servo depends on a fixed version.
[patch.crates-io]
# The released rsa 0.10.0 (Marvin timing fix, RUSTSEC-2023-0071) under the rc.19 version Servo pins.
rsa = { path = "vendor/rsa" }
# Servo's WebCrypto, with one line adapted to rsa 0.10.0's `primes()` returning `Odd<BoxedUint>`.
servo-script-webcrypto = { path = "vendor/servo-script-webcrypto" }
# libsqlite3-sys 0.36.0 with the bundled SQLite 3.54.1 from 0.39.1 (CVE-2026-119375,
# RUSTSEC-2026-0459): rusqlite 0.38 cannot use 0.39.
libsqlite3-sys = { path = "vendor/libsqlite3-sys" }
# surfman 0.14.0 without WS_VISIBLE on its WGL setup window, which otherwise flashes on screen
# and takes the focus at the start of every fetch on Windows.
surfman = { path = "vendor/surfman" }
