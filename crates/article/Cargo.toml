[package]
name = "juttusihti-article"
version = "0.5.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Protocol and picture processing for fetching full articles"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }

[dev-dependencies]
tempfile = "3"
