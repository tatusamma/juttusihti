[package]
name = "juttusihti-ai"
description = "AI provider clients and the user-approved analysis runner for Juttusihti"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
juttusihti-core = { path = "../core" }
reqwest = { version = "0.13", default-features = false, features = ["default-tls", "http2", "system-proxy"] }
tokio = { version = "1", features = ["sync", "time", "macros", "rt", "net", "io-util"] }
sha2 = "0.11"
base64 = "0.23"
getrandom = "0.4"
url = "2"
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
chrono.workspace = true
unicode-normalization = "0.1.26"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "time", "sync"] }
