[package]
name = "juttusihti-ai"
description = "AI provider clients and the user-approved analysis runner for Juttusihti"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
juttusihti-core = { path = "../core" }
reqwest = { version = "0.13", default-features = false, features = ["default-tls", "http2", "system-proxy"] }
tokio = { version = "1", features = ["sync", "time", "macros"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
chrono.workspace = true

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "time", "sync"] }
