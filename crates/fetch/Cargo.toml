[package]
name = "juttusihti-fetch"
description = "HTTP feed fetching with conditional requests, timeouts and bounded retries"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
juttusihti-core = { path = "../core" }
reqwest = { version = "0.13", default-features = false, features = ["default-tls", "charset", "http2", "system-proxy", "gzip", "brotli", "deflate"] }
tokio = { version = "1", features = ["rt", "time", "sync", "net"] }
url = "2"
encoding_rs = "0.8"
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "time"] }
